<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BestShopio Platform Center</title>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tailwind-config.js?v=20260607k"></script>
  <link rel="stylesheet" href="assets/theme.css?v=20260610g" />
  <link rel="stylesheet" href="assets/content-center.css?v=20260731-content-pages-v4" />
  <style>
    /* Platform Center: twin of the store admin. Reuses assets/theme.css wholesale;\n       only adds the few page-level bits the store admin modules also define locally. */
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    /* page header (title + actions), mirrors the analytics module header */
    .pc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .pc-sub { font-size: 13px; color: var(--ink-muted); margin-top: 4px; max-width: 760px; line-height: 1.5; }
    .pc-acts { display: flex; align-items: center; gap: 8px; flex: none; }
    .pc-eff { font-size: 12.5px; color: var(--ink-muted); }
    /* list filter panel: same bordered container used by Store Admin list pages */
    .pc-filters { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--hair); border-radius: 12px; background: #fff; }
    .pc-search { position: relative; display: inline-flex; align-items: center; }
    .pc-search > svg { position: absolute; left: 10px; color: var(--ink-muted); pointer-events: none; }
    .pc-spacer { flex: 1; }
    /* Attribution has two independent filters: a Type selector and a Domain keyword search. */
    .attribution-domain-type-filter { width: 150px; flex: 0 0 150px; }
    .attribution-domain-search { width: 250px; }
    .attribution-domain-search > svg { right: 10px; left: auto; }
    .attribution-domain-search.pc-search .filter-input { width: 100%; padding-left: 12px; padding-right: 32px; }
    .attribution-domain-filter-tags { display: flex; flex: 0 0 100%; flex-wrap: wrap; gap: 6px; margin-top: -2px; }
    .attribution-domain-filter-tags .field-pill { margin: 0; }
    .attribution-filter-clear { width: 17px; height: 17px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--ink-muted); font: inherit; font-size: 14px; line-height: 1; cursor: pointer; }
    .attribution-filter-clear:hover { background: #dce8fb; color: var(--ink); }
    /* tree cells (Menu / Category) */
    .tree { display: inline-flex; align-items: center; gap: 6px; }
    .tree-tg { width: 22px; height: 22px; border: 0; background: none; border-radius: 5px; color: var(--ink-muted); cursor: pointer; display: grid; place-items: center; }
    .tree-tg:hover { background: var(--panel); }
    .tree-sp { width: 22px; display: inline-block; flex: none; }
    .tree-ico { color: var(--ink-muted); display: inline-flex; }
    .perm-tag { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #6d28d9; background: #efe9ff; border-radius: 5px; padding: 1px 7px; }
    .menu-layout { display: block; }
    .menu-list { min-width: 0; }
    .menu-list .pc-filters { margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .menu-table-wrap { overflow-x: auto; }
    .menu-list .menu-table-wrap { border-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
    .menu-table-wrap .tbl { min-width: 1180px; }
    .menu-code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--ink-body); }
    .pill-main { background: #eef4ff; color: #1d4ed8; }
    .pill-channel { background: #ecfdf5; color: #047857; }
    .pill-app { background: #fff7ed; color: #c2410c; }
    .pill-hidden { background: #f4f4f5; color: #71717a; }
    .row-acts { display: flex; gap: 2px; }
    .menu-type-inline { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border: 1px solid var(--hair); border-radius: 8px; background: var(--panel); }
    .menu-type-inline-label { font-size: 13px; font-weight: 600; color: var(--ink-body); margin-right: 4px; }
    .menu-type-inline label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-body); }
    .menu-type-inline input { accent-color: var(--brand); }
    .modal .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .row-ic { width: 28px; height: 28px; border: 0; background: none; border-radius: 6px; color: var(--ink-muted); cursor: pointer; display: grid; place-items: center; }
    .row-ic:hover { background: var(--panel); color: var(--ink); }
    .row-ic.danger:hover { background: #fdecea; color: var(--err); }
    /* attribution forms */
    .blk-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
    .blk-sub { font-size: 12.5px; color: var(--ink-muted); margin: 0 0 10px; line-height: 1.5; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .col-stack { display: flex; flex-direction: column; gap: 16px; }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .prio-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .prio { font-size: 12.5px; color: var(--ink-body); background: var(--panel); border-radius: 6px; padding: 4px 9px; }
    .prio-arr { color: var(--ink-muted); font-size: 12px; }
    .form-block { max-width: 680px; }
    .attribution-settings-stack { display: grid; gap: 16px; margin-top: 0; }
    .attribution-settings-card { max-width: none; margin: 0; }
    .attribution-settings-title { display: flex; align-items: center; flex-wrap: wrap; }
    .attribution-guide { margin: 0 0 16px; padding: 20px; background: #fffbeb; border-color: #f2d391; }
    .attribution-guide.is-collapsed { padding: 13px 16px; }
    .attribution-guide-topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .attribution-guide.is-collapsed .attribution-guide-topline { align-items: center; }
    .attribution-guide-kicker { color: #a16207; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .attribution-guide-collapsed-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .attribution-guide-collapsed-copy strong { color: #7c5200; font-size: 13px; }
    .attribution-guide-collapsed-copy span { color: #8a681d; font-size: 12.5px; line-height: 1.45; }
    .attribution-guide-toggle { flex: none; display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 5px 9px; border: 1px solid #e8c979; border-radius: 7px; background: #fffdf5; color: #805b10; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .attribution-guide-toggle:hover { border-color: #c99b36; background: #fff7dc; }
    .attribution-guide-toggle-caret { font-size: 11px; line-height: 1; }
    .attribution-guide-details { margin-top: 8px; }
    .attribution-guide-head { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr); gap: 20px; align-items: stretch; padding-bottom: 18px; border-bottom: 1px solid #ecdba9; }
    .attribution-guide h2 { margin: 4px 0 6px; color: var(--ink); font-size: 18px; line-height: 1.35; }
    .attribution-guide h3 { margin: 0; color: var(--ink); font-size: 13px; line-height: 1.45; }
    .attribution-guide p { margin: 0; color: var(--ink-muted); font-size: 12.5px; line-height: 1.55; }
    .attribution-guide-summary { display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 14px; border: 1px solid #f0cf7c; border-radius: 10px; background: #fff7dc; }
    .attribution-guide-summary strong { color: #9a6400; font-size: 14px; }
    .attribution-guide-summary span { color: var(--ink-body); font-size: 12.5px; line-height: 1.5; }
    .attribution-guide-flow-title { margin: 18px 0 10px; color: var(--ink); font-size: 14px; font-weight: 700; }
    .attribution-guide-flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; }
    .attribution-guide-step { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; min-height: 118px; padding: 13px; border: 1px solid #eedfae; border-radius: 10px; background: #fffdf5; }
    .attribution-guide-step:not(:last-child)::after { content: '\2192'; position: absolute; z-index: 1; top: 50%; right: -25px; transform: translateY(-50%); color: #b77900; font-size: 20px; font-weight: 600; }
    .attribution-guide-step-number { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #fef0bd; color: #9a6400; font-size: 12px; font-weight: 700; }
    .attribution-guide-step p { margin-top: 4px; }
    .attribution-guide-note { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 12px; padding: 11px 13px; border-radius: 8px; background: #fff5d8; }
    .attribution-guide-note > div { display: flex; align-items: flex-start; gap: 8px; }
    .attribution-guide-note b { flex: none; color: var(--ink-body); font-size: 12px; }
    .attribution-guide-note span { color: var(--ink-muted); font-size: 12px; line-height: 1.5; }
    .attribution-guide-examples-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 20px 0 10px; }
    .attribution-guide-examples-head h3 { font-size: 14px; }
    .attribution-guide-examples-head p { margin-top: 3px; }
    .attribution-guide-examples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .attribution-guide-example { min-width: 0; padding: 13px; border: 1px solid #eedfae; border-radius: 10px; background: #fffdf8; }
    .attribution-example-journey { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
    .attribution-example-chip { display: inline-flex; max-width: 100%; padding: 4px 7px; border-radius: 5px; background: #fff5d8; color: var(--ink-body); font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
    .attribution-example-arrow { color: var(--ink-muted); font-size: 12px; }
    .attribution-example-outcome { margin-bottom: 5px; color: var(--brand); font-size: 12.5px; font-weight: 700; }
    .domain-dictionary-guide { margin-bottom: 16px; }
    .domain-guide-concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
    .domain-guide-concept { padding: 13px; border: 1px solid #eedfae; border-radius: 10px; background: #fff5d8; }
    .domain-guide-concept h3 { margin-bottom: 5px; }
    .domain-guide-section { margin-top: 20px; }
    .domain-guide-section-head { margin-bottom: 10px; }
    .domain-guide-section-head h3 { font-size: 14px; }
    .domain-guide-section-head p { margin-top: 3px; }
    .domain-guide-methods { overflow: hidden; border: 1px solid #eedfae; border-radius: 10px; background: #fffdf8; }
    .domain-guide-method { display: grid; grid-template-columns: 164px 176px minmax(0, 1fr); align-items: center; gap: 14px; min-width: 0; padding: 11px 13px; border-top: 1px solid #f1e3b9; }
    .domain-guide-method:first-child { border-top: 0; }
    .domain-guide-method > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .domain-guide-method strong { color: var(--ink); font-size: 12.5px; }
    .domain-guide-method > div > span { color: var(--ink-muted); font-size: 11.5px; }
    .domain-guide-method code { width: fit-content; max-width: 100%; padding: 3px 6px; border-radius: 5px; background: #fff5d8; color: var(--ink-body); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
    .domain-guide-method p { min-width: 0; }
    .domain-guide-method-header { background: #fff1c5; color: #805b10; font-size: 11.5px; font-weight: 700; }
    .domain-guide-method-header span { color: inherit; }
    .domain-guide-add-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
    .domain-guide-add-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 9px; align-items: flex-start; padding: 11px; border: 1px solid #eedfae; border-radius: 9px; background: #fffdf8; }
    .domain-guide-add-list li > span { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #fef0bd; color: #9a6400; font-size: 11.5px; font-weight: 700; }
    .domain-guide-add-list li p { margin-top: 1px; }
    .attribution-rule-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .attribution-rule-card { height: 100%; margin-bottom: 0; }
    .attribution-rule-card-single { height: auto; margin-bottom: 0; }
    .attribution-rule-value { margin-top: 8px; color: var(--ink); font-size: 14px; font-weight: 600; }
    .attribution-domain-rule { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .attribution-domain-rule-copy { min-width: 0; }
    .attribution-domain-rule-action { flex: none; white-space: nowrap; }
    .attribution-logic-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
    .attribution-logic-card { display: flex; min-width: 0; flex-direction: column; margin: 0; }
    .attribution-logic-card-head { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 11px; align-items: flex-start; padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
    .attribution-logic-card-head > span { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; background: #eaf2ff; color: var(--brand); font-size: 13px; font-weight: 700; }
    .attribution-logic-card-head h2 { margin: 1px 0 4px; color: var(--ink); font-size: 15px; line-height: 1.4; }
    .attribution-logic-card-head p { margin: 0; color: var(--ink-muted); font-size: 12.25px; line-height: 1.5; }
    .attribution-source-list { display: flex; flex-direction: column; margin-top: 12px; }
    .attribution-source-outcome { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
    .attribution-source-outcome:last-child { border-bottom: 0; }
    .attribution-source-outcome > div { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
    .attribution-source-outcome strong { color: var(--ink); font-size: 12.5px; line-height: 1.4; }
    .attribution-source-outcome span { color: var(--ink-muted); font-size: 11.5px; line-height: 1.45; }
    .attribution-source-outcome > b { flex: none; max-width: 42%; color: var(--brand); font-size: 11.75px; line-height: 1.4; text-align: right; }
    .attribution-logic-note { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; padding: 10px 11px; border-radius: 8px; background: #fff7dc; }
    .attribution-logic-note-blue { background: #f4f8ff; }
    .attribution-logic-note strong { color: var(--ink-body); font-size: 12px; }
    .attribution-logic-note span, .attribution-logic-footnote { color: var(--ink-muted); font-size: 11.5px; line-height: 1.5; }
    .attribution-logic-action { align-self: flex-start; margin-top: auto; transform: translateY(0); }
    .attribution-utm-fields { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .attribution-utm-fields code { padding: 5px 7px; border: 1px solid #d8e5f8; border-radius: 6px; background: #f7faff; color: var(--ink-body); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
    .attribution-logic-footnote { margin: 12px 0 0; }
    .attribution-model-summary { display: flex; flex-direction: column; gap: 5px; margin-top: 16px; padding: 12px; border: 1px solid #bad2f6; border-radius: 9px; background: #f4f8ff; }
    .attribution-model-summary > span { color: var(--ink-muted); font-size: 11.5px; }
    .attribution-model-summary > strong { color: var(--brand); font-size: 15px; }
    .attribution-model-summary p, .attribution-id-flow p { margin: 0; color: var(--ink-muted); font-size: 11.5px; line-height: 1.5; }
    .attribution-id-flow { display: grid; gap: 8px; margin-top: 10px; }
    .attribution-id-flow > div { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; min-width: 0; padding: 10px; border: 1px solid var(--hair); border-radius: 8px; }
    .attribution-id-flow > div > span { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #e9f2ff; color: var(--brand); font-size: 11px; font-weight: 700; }
    .attribution-id-flow code { color: var(--ink); font-size: 11px; }
    .attribution-channel-name { color: var(--ink); font-size: 12.5px; }
    .attribution-dictionary-filters { margin-top: 0; }
    .attribution-dictionary-table-wrap { overflow-x: auto; }
    .attribution-dictionary-scroll-hint { display: none; padding: 9px 12px; border-bottom: 1px solid var(--hair); background: #f7f9fc; color: var(--ink-muted); font-size: 11.5px; }
    .attribution-dictionary-table { min-width: 940px; }
    .attribution-dictionary-detail-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 18px; }
    .attribution-dictionary-detail-head .back-btn { margin-top: 1px; }
    .attribution-dictionary-detail-head .pc-sub { margin-top: 4px; }
    @media (max-width: 1160px) { .attribution-logic-grid { grid-template-columns: 1fr; } .attribution-logic-action { margin-top: 12px; } }
    @media (max-width: 760px) { .attribution-rule-row, .attribution-guide-head, .attribution-guide-flow, .attribution-guide-note, .attribution-guide-examples, .domain-guide-concepts, .domain-guide-add-list { grid-template-columns: 1fr; } .attribution-guide-topline { align-items: stretch; flex-direction: column; } .attribution-guide.is-collapsed .attribution-guide-topline { align-items: stretch; } .attribution-guide-toggle { align-self: flex-start; } .attribution-domain-rule { align-items: flex-start; flex-direction: column; } .attribution-domain-rule-action { width: 100%; justify-content: center; } .attribution-guide-flow { gap: 24px; } .attribution-guide-step { min-height: 0; } .attribution-guide-step:not(:last-child)::after { content: '\2193'; top: auto; right: auto; bottom: -23px; left: 19px; transform: none; } .domain-guide-method { grid-template-columns: 1fr; gap: 6px; } .domain-guide-method-header { display: none; } .attribution-source-outcome { flex-direction: column; } .attribution-source-outcome > b { max-width: none; text-align: left; } .attribution-dictionary-scroll-hint { display: block; } }
    .radio-card { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--hair); border-radius: 9px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
    .radio-card.on { border-color: var(--brand); background: #f4f8ff; }
    .radio-card input { margin-top: 3px; accent-color: var(--brand); flex: none; }
    .rc-title { font-size: 14px; font-weight: 600; color: var(--ink); }
    .rc-sub { font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; margin-top: 2px; }
    .win-row { display: flex; gap: 20px; flex-wrap: wrap; }
    .win-fld { flex: 1; min-width: 220px; }
    .fld-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-body); margin: 12px 0 6px; }
    .fld-hint { font-size: 12px; color: var(--ink-muted); margin: 6px 0 0; line-height: 1.45; }
    .num-input { display: inline-flex; align-items: center; }
    .num-input input { width: 110px; height: 36px; border: 1px solid var(--ctl); border-radius: 8px 0 0 8px; padding: 0 12px; font-size: 14px; }
    .num-input input:focus { outline: none; border-color: var(--brand); position: relative; z-index: 1; }
    .num-input .suffix { height: 36px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--ctl); border-left: 0; border-radius: 0 8px 8px 0; background: var(--panel); color: var(--ink-muted); font-size: 13px; }
    .form-foot { margin-top: 18px; }
    .ver-item { padding: 14px 0; border-bottom: 1px solid var(--hair); }
    .ver-item:last-child { border-bottom: 0; }
    .ver-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .ver-num { font-weight: 700; color: var(--ink); font-size: 14px; }
    .ver-sum { font-size: 13px; color: var(--ink-body); line-height: 1.5; }
    .ver-rc { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
    /* Top-center success toast mirrors store admin Ant Design message. */
    .pc-toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--ink); border: 1px solid var(--hair); border-radius: 8px; padding: 9px 16px; font-size: 13.5px; box-shadow: 0 6px 20px rgb(20 30 55 / 14%); animation: pcToastIn .18s ease; }
    .pc-toast-ico { color: #1f8f4e; display: inline-flex; }
    .pc-toast.pc-toast-out { opacity: 0; transform: translateX(-50%) translateY(-6px); transition: opacity .32s, transform .32s; }
    @keyframes pcToastIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    /* modal close x (C25) */
    .modal { position: relative; }
    .modal:has(.menu-modal-body) { width: min(520px, calc(100vw - 40px)); }
    .modal:has(.perm-modal-body) { width: min(520px, calc(100vw - 40px)); }
    .menu-modal-body { max-height: 68vh; overflow: auto; }
    .perm-modal-body { padding-top: 14px; }
    .fld-label.required::before { content: '*'; color: var(--err); margin-right: 4px; font-weight: 500; }
    .menu-modal-body .input, .perm-modal-body .input { box-sizing: border-box; }
    .count-input { position: relative; width: 100%; box-sizing: border-box; }
    .count-input .input { width: 100%; padding-right: 68px; box-sizing: border-box; }
